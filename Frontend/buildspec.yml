version: 0.2

env:
  variables:
    FRONTEND_BUCKET: "dropshipping-frontend"
    DR_BUCKET: "tushar-frontend-disaster"
    DR_ROLE_ARN: "arn:aws:iam::060868582714:role/FrontendDRDeploymentRole"
    CLOUDFRONT_DISTRIBUTION: "EU2GD4RRXDM86"
    DR_REGION: "ap-south-1"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies..."
      - cd Frontend
      - npm ci

  build:
    commands:
      - echo "Building frontend..."
      - npm run build

  post_build:
    commands:
      - echo "Uploading to Primary S3..."
      - aws s3 sync dist/ s3://$FRONTEND_BUCKET --delete

      - |
          echo "Assuming DR Deployment Role..."

          TEMP_ROLE=$(aws sts assume-role \
            --role-arn "$DR_ROLE_ARN" \
            --role-session-name frontend-dr \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)

          export AWS_ACCESS_KEY_ID=$(echo $TEMP_ROLE | awk '{print $1}')
          export AWS_SECRET_ACCESS_KEY=$(echo $TEMP_ROLE | awk '{print $2}')
          export AWS_SESSION_TOKEN=$(echo $TEMP_ROLE | awk '{print $3}')
          export AWS_DEFAULT_REGION=$DR_REGION

          echo "Uploading to DR Bucket..."
          aws s3 sync dist/ s3://$DR_BUCKET --delete

      - echo "Invalidating CloudFront..."
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION" --paths "/*"

artifacts:
  files:
    - '**/*'