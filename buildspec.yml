version: 0.2

env:
  variables:
    AWS_REGION: eu-north-1
    ACCOUNT_ID: "551656632415"
    IMAGE_REPO_NAME: dropshipping-backend

phases:
  pre_build:
    commands:
      - 'IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)'
      - 'echo "Image tag: $IMAGE_TAG"'
      - 'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com'

  build:
    commands:
      - 'docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG ./backend'
      - 'docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG'

  post_build:
    commands:
      - 'docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG'
      - 'printf ''[{"name":"backend","imageUri":"%s"}]'' "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG" > imagedefinitions.json'

artifacts:
  files:
    - imagedefinitions.json